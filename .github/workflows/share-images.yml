name: Publish share images
on:
  schedule:
    - cron: '4-59/10 * * * *'
  workflow_dispatch:
    inputs:
      trigger:
        description: Source of the refresh
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - scripts/share-images.mjs
      - package-lock.json
      - astro.config.mjs
      - src/lib/image-paths.mjs
      - src/lib/sleeve.mjs
      - src/lib/charts.mjs
      - src/lib/results.ts
      - src/lib/vault.ts
      - src/lib/scores.ts
      - src/lib/model-name.mjs
      - src/components/ResultsCharts.astro
      - src/styles/chart-fonts.css
      - src/styles/charts.css
      - src/styles/global.css
      - src/styles/analytics.css
      - 'src/pages/p/**/analytics.astro'
      - src/pages/analysis.astro
      - src/pages/index.astro
      - src/layouts/Layout.astro

permissions:
  contents: read

concurrency:
  group: bach-bench-share-images
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' &&
        github.actor == 'bach-bench-share-image-clock[bot]' &&
        github.triggering_actor == 'bach-bench-share-image-clock[bot]' &&
        inputs.trigger == 'vault-clock'))
    environment: share-images-main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHARE_IMAGE_WORK: /tmp/bach-share-images
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - id: plan
        run: npm run share:images -- plan
      - if: steps.plan.outputs.needed == 'true'
        run: |
          npm ci
          npm exec --offline -- playwright install --with-deps chromium
          npm run share:images -- render
      - if: steps.plan.outputs.needed == 'true'
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: npm run share:images -- publish
